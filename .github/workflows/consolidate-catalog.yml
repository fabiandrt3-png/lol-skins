name: Consolidate skin catalog

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'data-loader.js'
      - 'scripts/consolidate-catalog.mjs'
      - '.github/workflows/consolidate-catalog.yml'

permissions:
  contents: write

concurrency:
  group: consolidate-skin-catalog
  cancel-in-progress: true

jobs:
  consolidate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Build centralized catalogue
        run: node scripts/consolidate-catalog.mjs

      - name: Validate loader syntax
        run: node --check data-loader.js

      - name: Validate generated catalogue
        shell: bash
        run: |
          node <<'NODE'
          const payload = require('./data/image-overrides.json');
          if (!Array.isArray(payload.catalog) || !payload.catalog.length) throw new Error('catalog missing');
          if (!payload.entries || Array.isArray(payload.entries)) throw new Error('verified override map missing');

          const ids = new Set();
          const artworkKeys = new Set();
          for (const skin of payload.catalog) {
            if (!skin.id || !skin.champ || !skin.skin || !skin.image) throw new Error(`invalid skin record: ${JSON.stringify(skin)}`);
            if (ids.has(skin.id)) throw new Error(`duplicate catalog id: ${skin.id}`);
            ids.add(skin.id);

            const platform = skin.type === 'Wild Rift' ? 'wild-rift' : 'pc';
            const key = `${skin.champ}::${skin.skin}::${platform}`;
            if (artworkKeys.has(key)) throw new Error(`duplicate catalog record: ${key}`);
            artworkKeys.add(key);
          }

          console.log('catalog:', payload.catalog.length);
          console.log('verified overrides:', Object.keys(payload.entries).length);
          console.log('unique ids:', ids.size);
          NODE

      - name: Commit centralized catalogue
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/image-overrides.json
          if git diff --cached --quiet; then
            echo "Catalogue already centralized"
            exit 0
          fi
          git commit -m "Centralize skin catalog"
          git pull --rebase origin main
          git push
