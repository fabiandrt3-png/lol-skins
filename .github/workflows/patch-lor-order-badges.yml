name: Apply LoR ordering and badge cleanup

on:
  push:
    paths:
      - '.github/workflows/patch-lor-order-badges.yml'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Patch LoR ordering and labels
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          loader_path = Path("data-loader.js")
          loader = loader_path.read_text()
          merge_pattern = re.compile(r"function mergeLorSkins\(catalog, lorSkins\) \{.*?\n\}\n(?=\nfunction compareLorEntries)", re.S)
          new_merge = '''function mergeLorSkins(catalog, lorSkins) {
            const merged = catalog.map((item) => ({ ...item }));
            const orderedLor = (lorSkins || [])
              .filter(validSkinEntry)
              .map((item, index) => ({ ...item, _lorInputIndex: index }))
              .sort(compareLorEntries);
            const byChampion = new Map();

            for (const lor of orderedLor) {
              const cleanLor = { ...lor };
              delete cleanLor._lorInputIndex;
              if (!byChampion.has(cleanLor.champ)) byChampion.set(cleanLor.champ, []);
              byChampion.get(cleanLor.champ).push(cleanLor);
            }

            for (const [champion, entries] of byChampion) {
              const incomingIds = new Set(entries.map(stableSkinId));
              for (let index = merged.length - 1; index >= 0; index -= 1) {
                if (merged[index]?.sourceKind === "lor" && incomingIds.has(stableSkinId(merged[index]))) {
                  merged.splice(index, 1);
                }
              }

              const originals = entries.filter(isLorOriginal);
              const variants = entries.filter((item) => !isLorOriginal(item));

              if (originals.length) {
                const classicIndex = findClassicSkinIndex(merged, champion);
                const firstChampionIndex = merged.findIndex((item) => item.champ === champion);
                const insertAt = classicIndex >= 0
                  ? classicIndex + 1
                  : firstChampionIndex >= 0
                    ? firstChampionIndex + 1
                    : merged.length;
                merged.splice(insertAt, 0, ...originals);
              }

              if (variants.length) {
                let lastChampionIndex = -1;
                for (let index = merged.length - 1; index >= 0; index -= 1) {
                  if (merged[index].champ === champion) {
                    lastChampionIndex = index;
                    break;
                  }
                }
                merged.splice(lastChampionIndex >= 0 ? lastChampionIndex + 1 : merged.length, 0, ...variants);
              }
            }

            return merged;
          }

          function isLorOriginal(item) {
            return item?.type === "Legends of Runeterra" && /^original$/i.test(String(item?.lorSkinName || ""));
          }

          function findClassicSkinIndex(items, champion) {
            const isClassic = (item) => {
              if (item?.champ !== champion || item?.type === "Legends of Runeterra") return false;
              const name = String(item?.skin || "").trim();
              return /^classic(?:\\s|$)/i.test(name) || name.localeCompare(champion, "en", { sensitivity: "base" }) === 0;
            };

            const pcClassic = items.findIndex((item) => isClassic(item) && item.type !== "Wild Rift");
            return pcClassic >= 0 ? pcClassic : items.findIndex(isClassic);
          }
          '''
          loader, count = merge_pattern.subn(lambda _: new_merge.rstrip(), loader, count=1)
          if count != 1:
              raise SystemExit("mergeLorSkins patch target not found")
          loader_path.write_text(loader)

          ui_path = Path("english-ui.js")
          ui = ui_path.read_text()
          ui = ui.replace('const WILD_RIFT_SUFFIX = /\\s*\\(\\s*Wild Rift\\s*\\)/gi;\n\n', '', 1)

          wr_style = '''    .skin-title-wrap .badge-wr {
              border-color: rgba(100, 210, 255, .24);
              background: rgba(100, 210, 255, .13);
              color: #64d2ff;
            }
          '''
          lor_style = wr_style + '''
            .skin-title-wrap .badge-lor {
              border-color: rgba(191, 90, 242, .28);
              background: rgba(191, 90, 242, .14);
              color: #bf5af2;
            }
          '''
          if wr_style not in ui:
              raise SystemExit("LoR style insertion target not found")
          ui = ui.replace(wr_style, lor_style, 1)

          parse_anchor = '''  let displayName = raw;
            let chromaLabel = "";

            const isWildRift ='''
          parse_replacement = '''  let displayName = raw;
            let chromaLabel = "";
            let lorLevel = "";

            const levelMatch = displayName.match(/\\s*[—–-]\\s*(Level\\s*\\d+)\\s*$/i);
            if (levelMatch) {
              lorLevel = levelMatch[1].replace(/level/i, "Level").replace(/\\s+/g, " ");
              displayName = displayName.slice(0, levelMatch.index).trim();
            }

            const isWildRift ='''
          if parse_anchor not in ui:
              raise SystemExit("LoR level parse target not found")
          ui = ui.replace(parse_anchor, parse_replacement, 1)
          ui = ui.replace('    chromaLabel,\n    isWildRift,', '    chromaLabel,\n    lorLevel,\n    isWildRift,', 1)

          ui = ui.replace('  const existingWildRiftBadge = card.querySelector(".badge-wr");\n', '  const existingWildRiftBadge = card.querySelector(".badge-wr");\n  const existingLorBadge = card.querySelector(".badge-lor");\n', 1)
          ui = ui.replace('/^(Wild Rift|League of Legends PC)$/i', '/^(Wild Rift|League of Legends PC|Legends of Runeterra)$/i')

          chroma_flag = '  const isChroma = Boolean(parsed.chromaLabel || existingChromaBadge || /\\bchroma\\b/i.test(rawTitle));\n'
          lor_flag = '''  const isLor = Boolean(
            existingLorBadge
            || /^Legends of Runeterra$/i.test(legacyPlatformText?.textContent?.trim() || "")
          );
          '''
          if chroma_flag not in ui:
              raise SystemExit("LoR badge flag target not found")
          ui = ui.replace(chroma_flag, lor_flag + chroma_flag, 1)
          ui = ui.replace('  const chromaLabel = parsed.chromaLabel || existingChromaBadge?.textContent?.trim() || "Chroma";\n', '  const chromaLabel = parsed.chromaLabel || existingChromaBadge?.textContent?.trim() || "Chroma";\n  const lorLabel = parsed.lorLevel ? `Legends of Runeterra · ${parsed.lorLevel}` : "Legends of Runeterra";\n', 1)
          ui = ui.replace('const needsBadgeRow = isWildRift || isChroma || Boolean(badgeRow?.children.length);', 'const needsBadgeRow = isWildRift || isLor || isChroma || Boolean(badgeRow?.children.length);', 1)

          cleanup_anchor = '''    badgeRow.querySelectorAll(".badge-chroma").forEach((badge, index) => {
              if (!isChroma || index > 0) badge.remove();
            });
          '''
          cleanup_replacement = '''    badgeRow.querySelectorAll(".badge-lor").forEach((badge, index) => {
              if (!isLor || index > 0) badge.remove();
            });
            badgeRow.querySelectorAll(".badge-chroma").forEach((badge, index) => {
              if (!isChroma || index > 0) badge.remove();
            });
          '''
          if cleanup_anchor not in ui:
              raise SystemExit("LoR badge cleanup target not found")
          ui = ui.replace(cleanup_anchor, cleanup_replacement, 1)
          ui = ui.replace('    if (isWildRift) ensureBadge(badgeRow, "badge-wr", "Wild Rift");\n', '    if (isWildRift) ensureBadge(badgeRow, "badge-wr", "Wild Rift");\n    if (isLor) ensureBadge(badgeRow, "badge-lor", lorLabel);\n', 1)

          text_branch = '''  if (target.nodeType === Node.TEXT_NODE) {
            const current = target.nodeValue;
            const translated = translateValue(current);
            if (translated !== current) target.nodeValue = translated;
            return;
          }
          '''
          text_replacement = '''  if (target.nodeType === Node.TEXT_NODE) {
            const current = target.nodeValue;
            if (target.parentElement?.id === "lightboxTitle") {
              const parsed = parseCardSkinName(current);
              if (parsed.lorLevel) {
                target.nodeValue = parsed.displayName;
                return;
              }
            }
            const translated = translateValue(current);
            if (translated !== current) target.nodeValue = translated;
            return;
          }
          '''
          if text_branch not in ui:
              raise SystemExit("Lightbox title cleanup target not found")
          ui = ui.replace(text_branch, text_replacement, 1)
          ui_path.write_text(ui)

          version_path = Path("version.json")
          version = json.loads(version_path.read_text())
          version["version"] = "20260911-91"
          version_path.write_text(json.dumps(version, indent=2) + "\n")
          PY

      - name: Verify JavaScript syntax
        run: |
          node --check data-loader.js
          node --check english-ui.js
          grep -q 'Legends of Runeterra ·' english-ui.js
          grep -q 'findClassicSkinIndex' data-loader.js
          grep -q '20260911-91' version.json

      - name: Commit patch and remove one-shot workflow
        shell: bash
        run: |
          rm .github/workflows/patch-lor-order-badges.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data-loader.js english-ui.js version.json .github/workflows/patch-lor-order-badges.yml
          git commit -m 'Refine LoR ordering and level badges'
          git push
