name: Audit splash arts

on:
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'
  push:
    branches: [main]
    paths:
      - 'data/image-overrides.json'
      - 'data/manual-skins.txt'
      - 'data/lor-art.json'
      - 'data/lor-skins.json'
      - 'data-loader.js'
      - 'scripts/repair-catalog-edge-cases.mjs'
      - 'scripts/sync-missing-skins.mjs'
      - 'scripts/audit-additions.mjs'
      - 'scripts/centralize-catalog.mjs'
      - 'scripts/upgrade-low-res.mjs'
      - 'scripts/finalize-hd.mjs'
      - 'scripts/update-lor-art.mjs'
      - 'scripts/update-lor-skins.mjs'
      - 'scripts/repair-lor-skin-images.mjs'
      - 'scripts/lor-art-source.mjs'
      - 'scripts/cleanup-lor-fallbacks.mjs'
      - 'scripts/preserve-audit-quality.mjs'
      - '.github/workflows/audit-splashes.yml'

concurrency:
  group: audit-splash-arts
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Repair catalog naming edge cases
        run: node scripts/repair-catalog-edge-cases.mjs

      - name: Snapshot catalog before sync
        shell: bash
        run: cp data/image-overrides.json "$RUNNER_TEMP/image-overrides-before-sync.json"

      - name: Sync missing PC and Wild Rift skins
        run: node scripts/sync-missing-skins.mjs

      - name: Stabilize no-op sync metadata
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const target = 'data/image-overrides.json';
          const snapshot = `${process.env.RUNNER_TEMP}/image-overrides-before-sync.json`;
          const current = JSON.parse(fs.readFileSync(target, 'utf8'));
          const before = JSON.parse(fs.readFileSync(snapshot, 'utf8'));
          const added = Number(current?.catalogSync?.added || 0);
          if (added === 0) {
            // Keep the fresh zero-missing/unresolved result, but remove volatile timestamps.
            // This persists a corrected status once and makes every later no-op pass byte-stable.
            current.catalogGeneratedAt = before.catalogGeneratedAt;
            if (current.catalogSync) delete current.catalogSync.runAt;
            fs.writeFileSync(target, JSON.stringify(current, null, 2) + '\n');
            const missing = Number(current?.catalogSync?.PC?.missing || 0) + Number(current?.catalogSync?.['Wild Rift']?.missing || 0);
            console.log(`No skins added; preserved stable sync result (${missing} missing).`);
          } else {
            console.log(`Kept sync changes: ${added} skin(s) added.`);
          }
          NODE

      - name: Sort centralized catalogue
        run: node scripts/centralize-catalog.mjs

      - name: Persist synchronized skin catalogue
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/image-overrides.json version.json
          if git diff --cached --quiet; then
            echo "Centralized catalogue already synchronized and sorted"
          else
            git commit -m "Sync and sort centralized skin catalogue"
            git push
          fi

      - name: Refresh official Legends of Runeterra art index
        continue-on-error: true
        run: node scripts/update-lor-art.mjs

      - name: Refresh Legends of Runeterra skin catalog
        continue-on-error: true
        run: node scripts/update-lor-skins.mjs

      - name: Resolve and verify Legends of Runeterra splash arts
        run: node scripts/repair-lor-skin-images.mjs

      - name: Bump asset version for LoR catalog changes
        shell: bash
        run: |
          if git diff --quiet -- data/lor-skins.json; then
            echo "LoR catalog unchanged"
            exit 0
          fi
          node <<'NODE'
          const fs = require('fs');
          const file = 'version.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const current = String(data.version || '20260911-97');
          const match = current.match(/^(.*-)(\d+)$/);
          data.version = match ? `${match[1]}${Number(match[2]) + 1}` : `${current}-1`;
          fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          console.log(`Version: ${current} -> ${data.version}`);
          NODE

      - name: Preserve centralized catalogue
        shell: bash
        run: cp data/image-overrides.json "$RUNNER_TEMP/image-overrides-before-audit.json"

      - name: Install image probe
        run: npm install --no-save sharp@0.34.3

      - name: Audit recent PC and Wild Rift additions
        continue-on-error: true
        run: node scripts/audit-additions.mjs

      - name: Audit historical splash arts
        continue-on-error: true
        run: node scripts/audit-splashes.mjs

      - name: Search and repair missing Wild Rift splash arts
        continue-on-error: true
        run: node scripts/resolve-missing-wr.mjs

      - name: Restore centralized catalogue
        if: always()
        shell: bash
        run: |
          node <<'NODE'
          const fs = require('fs');
          const beforePath = `${process.env.RUNNER_TEMP}/image-overrides-before-audit.json`;
          const targetPath = 'data/image-overrides.json';
          if (!fs.existsSync(beforePath) || !fs.existsSync(targetPath)) process.exit(0);

          const before = JSON.parse(fs.readFileSync(beforePath, 'utf8'));
          const current = JSON.parse(fs.readFileSync(targetPath, 'utf8'));
          if (!Array.isArray(before.catalog) || !before.catalog.length) {
            throw new Error('Centralized catalogue snapshot is missing');
          }

          current.catalog = before.catalog;
          current.catalogGeneratedAt = before.catalogGeneratedAt;
          current.catalogStrategy = before.catalogStrategy;
          current.catalogSync = before.catalogSync;
          fs.writeFileSync(targetPath, JSON.stringify(current, null, 2) + '\n');
          console.log(`Preserved ${before.catalog.length} centralized skin records`);
          NODE

      - name: Maximize every exact Wiki HD splash
        continue-on-error: true
        run: node scripts/upgrade-low-res.mjs

      - name: Search unlisted higher-resolution Wiki files and repair cards
        continue-on-error: true
        run: node scripts/finalize-hd.mjs

      - name: Preserve previously verified higher-resolution sources
        continue-on-error: true
        run: node scripts/preserve-audit-quality.mjs "$RUNNER_TEMP/image-overrides-before-audit.json"

      - name: Remove obsolete LoR fallback metadata
        continue-on-error: true
        run: node scripts/cleanup-lor-fallbacks.mjs

      - name: Save verified image map, LoR catalog, and audit reports
        shell: bash
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/image-overrides.json data/manual-skins.txt data/lor-art.json data/lor-skins.json audit-report.json addition-audit-report.json version.json 2>/dev/null || true

          if git diff --cached --quiet; then
            echo "No audit changes"
            exit 0
          fi

          git commit -m "Refresh verified splash art sources"

          for attempt in 1 2 3; do
            if git push; then
              echo "Audit updates pushed successfully"
              exit 0
            fi
            echo "Remote changed while the audit was running; rebasing (attempt ${attempt}/3)..."
            git fetch origin main
            if ! git rebase origin/main; then
              git rebase --abort || true
              echo "::warning::Could not rebase audit updates. Verification completed, but generated files were not published."
              exit 0
            fi
          done
          echo "::warning::Could not push audit updates after 3 attempts. Verification completed without failing the workflow."
          exit 0

      - name: Publish verification summary
        if: always()
        shell: bash
        run: |
          node <<'NODE' >> "$GITHUB_STEP_SUMMARY"
          const fs = require('fs');
          const historical = fs.existsSync('audit-report.json') ? JSON.parse(fs.readFileSync('audit-report.json', 'utf8')) : {};
          const additions = fs.existsSync('addition-audit-report.json') ? JSON.parse(fs.readFileSync('addition-audit-report.json', 'utf8')) : {};
          const catalogData = fs.existsSync('data/image-overrides.json') ? JSON.parse(fs.readFileSync('data/image-overrides.json', 'utf8')) : {};
          const lor = fs.existsSync('data/lor-art.json') ? JSON.parse(fs.readFileSync('data/lor-art.json', 'utf8')) : {};
          const lorSkins = fs.existsSync('data/lor-skins.json') ? JSON.parse(fs.readFileSync('data/lor-skins.json', 'utf8')) : {};
          const s = historical.summary || {};
          const a = additions.summary || {};
          const c = catalogData.catalogSync || {};
          const m = historical.wikiMaximumPass || additions.wikiMaximumPass || {};
          const f = historical.finalHdPass || additions.finalHdPass || {};
          const l = lorSkins.imageAudit || {};
          console.log('## Splash art verification');
          console.log('');
          console.log(`- Catalog skins added by sync: ${c.added ?? '?'}`);
          console.log(`- Catalog sync unresolved: ${(c.unresolved || []).length}`);
          console.log(`- Historical verified: ${s.verified ?? '?'} / ${s.total ?? '?'}`);
          console.log(`- Historical PC: ${s.pcVerified ?? '?'} / ${s.pcTotal ?? '?'}`);
          console.log(`- Historical Wild Rift: ${s.wildRiftVerified ?? '?'} / ${s.wildRiftTotal ?? '?'}`);
          console.log(`- Historical fullscreen below 2560x1440: ${s.below2560x1440 ?? '?'}`);
          console.log(`- Recent additions fully verified: ${a.fullyVerified ?? '?'} / ${a.total ?? '?'}`);
          console.log(`- Recent additions unresolved: ${a.unresolved ?? '?'}`);
          console.log(`- Recent fullscreen below 1600x900: ${a.belowFullscreenTarget ?? '?'}`);
          console.log(`- Exact Wiki HD historical upgrades: ${m.historicalUpgraded ?? '?'}`);
          console.log(`- Exact Wiki HD catalog upgrades: ${m.catalogUpgraded ?? '?'}`);
          console.log(`- Recovered higher unlisted Wiki files: ${f.historicalRecoveredHigher ?? 0}`);
          console.log(`- Recent higher unlisted Wiki files: ${f.catalogRecoveredHigher ?? 0}`);
          console.log(`- Broken card fallbacks repaired: ${f.cardFallbacksRepaired ?? 0}`);
          console.log(`- Chroma entries checked/upgraded: ${m.chromaChecked ?? '?'} / ${m.chromaUpgraded ?? '?'}`);
          console.log(`- Legends of Runeterra champion art names indexed: ${Object.keys(lor.champions || {}).length}`);
          console.log(`- Legends of Runeterra level artworks: ${(lorSkins.entries || []).length}`);
          console.log(`- Legends of Runeterra verified artworks: ${l.verified ?? '?'} / ${l.total ?? '?'}`);
          console.log(`- Legends of Runeterra unresolved artworks: ${l.unresolved ?? '?'}`);
          console.log('');
          console.log((c.unresolved || []).length > 0 || (s.unresolved ?? 0) > 0 || (a.unresolved ?? 0) > 0 || (l.unresolved ?? 0) > 0
            ? '⚠️ Some splash arts are unresolved. Inspect the audit reports for details.'
            : '✅ No unresolved splash arts detected.');
          NODE
