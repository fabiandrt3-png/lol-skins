name: Audit splash arts

on:
  push:
    branches: [main]
    paths-ignore:
      - data/image-overrides.json
      - audit-report.json
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * 1'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install image probe
        run: npm install --no-save sharp@0.34.3

      - name: Audit every splash art
        continue-on-error: true
        run: node scripts/audit-splashes.mjs

      - name: Search and repair missing Wild Rift splash arts
        continue-on-error: true
        run: node scripts/resolve-missing-wr.mjs

      - name: Search higher resolution exact originals
        continue-on-error: true
        run: node scripts/upgrade-low-res.mjs

      - name: Save verified image map and audit report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data-loader.js data/image-overrides.json audit-report.json
          if git diff --cached --quiet; then
            echo "No audit changes"
          else
            git commit -m "Update verified splash art sources"
            git push
          fi

      - name: Fail if unresolved images remain
        run: node -e "const r=require('./audit-report.json'); if(r.summary.unresolved>0){console.error(r.summary.unresolved+' unresolved splash arts'); process.exit(1)}"
