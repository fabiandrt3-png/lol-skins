name: Runtime regression tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check browser module syntax
        run: |
          for file in app.js data-loader.js english-ui.js lightbox-hd.js lore.js; do
            node --check "$file"
          done
      - name: Test catalog loading and ordering
        run: node --test tests/*.test.mjs
