name: Repair LoR artwork sources

on:
  workflow_dispatch:
  schedule:
    - cron: '47 5 * * 1'
  push:
    branches: [main]
    paths:
      - 'data/lor-skins.json'
      - 'scripts/update-lor-skins.mjs'
      - 'scripts/repair-lor-skin-images.mjs'
      - '.github/workflows/repair-lor-images.yml'

concurrency:
  group: repair-lor-artwork-sources
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  repair:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Repair LoR artwork sources')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Verify LoR scripts
        run: |
          node --check scripts/update-lor-skins.mjs
          node --check scripts/repair-lor-skin-images.mjs

      - name: Regenerate complete LoR skin catalog
        run: node scripts/update-lor-skins.mjs

      - name: Resolve and validate LoR splash art files
        run: node scripts/repair-lor-skin-images.mjs

      - name: Verify repaired catalog
        run: |
          node <<'NODE'
          const fs = require('fs');
          const data = JSON.parse(fs.readFileSync('data/lor-skins.json', 'utf8'));
          const entries = Array.isArray(data.entries) ? data.entries : [];
          const unresolved = entries.filter((entry) => entry.imageStatus === 'unresolved' || !entry.image);
          const unchecked = entries.filter((entry) => entry.imageStatus === 'unchecked');
          const verified = entries.filter((entry) => entry.imageStatus === 'verified' && entry.image);
          console.log(`LoR artwork verification: ${verified.length}/${entries.length} verified, ${unchecked.length} unchecked, ${unresolved.length} unresolved.`);
          const akshan = entries.filter((entry) => entry.champ === 'Akshan');
          for (const entry of akshan) {
            console.log(`${entry.skin}: ${entry.imageStatus || 'unknown'} -> ${entry.image || 'NO IMAGE'}`);
          }
          if (unresolved.length) {
            console.warn(`Unresolved entries: ${unresolved.map((entry) => `${entry.champ} / ${entry.skin}`).join(' | ')}`);
          }
          if (unchecked.length) {
            console.warn(`Unchecked entries preserved after temporary lookup failures: ${unchecked.length}`);
          }
          NODE

      - name: Bump app asset version when catalog changed
        shell: bash
        run: |
          if git diff --quiet -- data/lor-skins.json; then
            echo 'LoR image catalog unchanged'
            exit 0
          fi
          node <<'NODE'
          const fs = require('fs');
          const file = 'version.json';
          const data = JSON.parse(fs.readFileSync(file, 'utf8'));
          const current = String(data.version || '20260911-96');
          const match = current.match(/^(.*-)(\d+)$/);
          data.version = match ? `${match[1]}${Number(match[2]) + 1}` : `${current}-1`;
          fs.writeFileSync(file, JSON.stringify(data, null, 2) + '\n');
          console.log(`Version: ${current} -> ${data.version}`);
          NODE

      - name: Commit repaired LoR sources
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/lor-skins.json version.json
          if git diff --cached --quiet; then
            echo 'No LoR artwork repair changes'
            exit 0
          fi
          git commit -m 'Repair LoR artwork sources'
          for attempt in 1 2 3; do
            if git push; then exit 0; fi
            git fetch origin main
            git rebase origin/main || { git rebase --abort || true; exit 1; }
          done
          exit 1
