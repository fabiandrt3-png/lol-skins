<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="description" content="Explore League of Legends and Wild Rift champions and skins.">
  <title>LoL Skins</title>
  <link rel="preconnect" href="https://wiki.leagueoflegends.com">
  <link rel="preconnect" href="https://game.gtimg.cn">
  <link id="appStyles" rel="stylesheet" href="styles.css?v=20260911-62">
  <link id="loreStyles" rel="stylesheet" href="lore.css?v=20260911-62">
  <style>
    body:not(.is-champion-view) #sectionKicker,
    body:not(.is-champion-view) #resultCount,
    body:not(.is-champion-view) .champion-info > span,
    body:not(.is-champion-view) .champion-info > small,
    body:not(.is-champion-view) #hero {
      display: none !important;
    }

    body:not(.is-champion-view) .controls {
      padding-top: max(clamp(18px, 2.5vw, 28px), env(safe-area-inset-top));
    }

    /* Card previews fill their 16:9 frame. Fullscreen keeps its own contain
       rule so the complete splash art remains visible. */
    .skin-preview img {
      object-fit: cover;
    }

    /* The fullscreen toolbar stays available when the splash is first opened.
       It only disappears while an actual desktop/mobile zoom is active. */
    .lightbox-toolbar {
      opacity: 1;
      visibility: visible;
      transform: translateY(0);
      transition: opacity .16s ease, visibility .16s ease, transform .16s ease;
    }

    .lightbox[data-zoomed="true"] .lightbox-toolbar {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
      transform: translateY(-8px);
    }

    /* Arcane Iron Will uses Riot's shared Arcane group splash. Keep the full
       artwork in fullscreen while centering Ambessa in her card on all screens. */
    .skin-preview img[alt="Arcane Iron Will Ambessa"] {
      object-position: 82% center;
    }

    /* The carousel track is 300% wide. Override the figure grid centering so
       the middle slide is truly aligned with the viewport instead of the next one. */
    .lightbox-figure > div {
      justify-self: start;
      align-self: stretch;
    }
  </style>
</head>
<body>
  <div class="app-shell">
    <button class="back-button" id="backButton" type="button" aria-label="Back to champions" hidden>
      <span aria-hidden="true">←</span>
    </button>

    <main>
      <section class="hero" id="hero">
        <div class="hero-backdrop" id="heroBackdrop" aria-hidden="true"></div>
        <div class="hero-overlay" aria-hidden="true"></div>
        <div class="hero-content">
          <h1 id="pageTitle"></h1>
        </div>
      </section>

      <section class="controls" aria-label="Search and filters">
        <label class="search-box" for="searchInput">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20">
            <path d="m21 21-4.35-4.35m2.35-5.65A8 8 0 1 1 3 11a8 8 0 0 1 16 0Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          </svg>
          <input id="searchInput" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search" placeholder="Search for a champion…">
          <kbd aria-hidden="true">/</kbd>
        </label>

        <div class="filter-row" id="filterRow" aria-label="Filters" hidden>
          <button class="filter-chip is-active" type="button" data-filter="all">All</button>
          <button class="filter-chip" type="button" data-filter="pc">PC</button>
          <button class="filter-chip" type="button" data-filter="wild-rift">Wild Rift</button>
          <button class="filter-chip" type="button" data-filter="prestige">Prestige / Mythic</button>
          <button class="filter-chip" type="button" data-filter="chroma">Chromas</button>
          <button class="filter-chip" type="button" data-filter="favorites">♥ Favorites</button>
        </div>
      </section>

      <section class="content-section" aria-live="polite">
        <div class="section-heading">
          <div>
            <p class="section-kicker" id="sectionKicker" hidden>Collection</p>
            <h2 id="sectionTitle">Champions</h2>
          </div>
          <p class="result-count" id="resultCount" hidden></p>
        </div>

        <div class="loading-state" id="loadingState">
          <span class="spinner" aria-hidden="true"></span>
          <p>Loading collection…</p>
        </div>

        <div class="empty-state" id="emptyState" hidden>
          <span aria-hidden="true">⌕</span>
          <h3>No results</h3>
          <p>Try another search or remove a filter.</p>
        </div>

        <div class="card-grid" id="cardGrid" hidden></div>
      </section>
    </main>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Skin preview" hidden>
    <button class="lightbox-backdrop" type="button" data-close-lightbox aria-label="Close preview"></button>
    <div class="lightbox-toolbar">
      <div class="lightbox-caption">
        <span id="lightboxPosition"></span>
        <strong id="lightboxTitle"></strong>
      </div>
      <div class="lightbox-actions">
        <button class="icon-button lore-button" id="lightboxLore" type="button" aria-label="View lore" aria-controls="lorePanel" aria-expanded="false" hidden>
          <svg aria-hidden="true" viewBox="0 0 24 24" fill="none">
            <path d="M12 6.5v14" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            <path d="M3.5 18.5V4.75A2.75 2.75 0 0 1 6.25 2H9a3 3 0 0 1 3 3v15.5a3.5 3.5 0 0 0-3.5-3.5H5a1.5 1.5 0 0 0-1.5 1.5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
            <path d="M20.5 18.5V4.75A2.75 2.75 0 0 0 17.75 2H15a3 3 0 0 0-3 3v15.5a3.5 3.5 0 0 1 3.5-3.5H19a1.5 1.5 0 0 1 1.5 1.5Z" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
        </button>
        <button class="icon-button" id="lightboxFavorite" type="button" aria-label="Add to favorites">♡</button>
        <button class="icon-button" id="lightboxClose" type="button" data-close-lightbox aria-label="Close">×</button>
      </div>
    </div>
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev" type="button" aria-label="Previous skin">‹</button>
    <figure class="lightbox-figure" id="lightboxFigure">
      <img id="lightboxImage" alt="" decoding="async">
    </figure>
    <button class="lightbox-nav lightbox-next" id="lightboxNext" type="button" aria-label="Next skin">›</button>
  </div>

  <noscript>This application requires JavaScript to display skins.</noscript>

  <script>
    (() => {
      const lightbox = document.querySelector("#lightbox");
      if (!lightbox) return;

      const syncZoomChrome = () => {
        const mobileZoomed = (window.visualViewport?.scale ?? 1) > 1.01;
        const desktopZoomed = lightbox.dataset.desktopZoomed === "true";
        lightbox.dataset.zoomed = mobileZoomed || desktopZoomed ? "true" : "false";
      };

      window.visualViewport?.addEventListener("resize", syncZoomChrome, { passive: true });
      window.addEventListener("resize", syncZoomChrome, { passive: true });

      const observer = new MutationObserver(syncZoomChrome);
      observer.observe(lightbox, {
        attributes: true,
        attributeFilter: ["data-desktop-zoomed", "hidden"],
      });

      syncZoomChrome();
    })();
  </script>

  <script type="module">
    const fallbackVersion = "20260911-62";
    let version = fallbackVersion;

    try {
      const response = await fetch(`version.json?t=${Date.now()}`, { cache: "no-store" });
      if (response.ok) {
        const payload = await response.json();
        if (typeof payload?.version === "string" && payload.version) version = payload.version;
      }
    } catch (error) {
      console.warn("Remote version unavailable; using the bundled version.", error);
    }

    const stylesheet = document.querySelector("#appStyles");
    if (stylesheet) stylesheet.href = `styles.css?v=${encodeURIComponent(version)}`;
    const loreStylesheet = document.querySelector("#loreStyles");
    if (loreStylesheet) loreStylesheet.href = `lore.css?v=${encodeURIComponent(version)}`;

    await import(`./app.js?v=${encodeURIComponent(version)}`);

    try {
      await import(`./english-ui.js?v=${encodeURIComponent(version)}`);
    } catch (error) {
      console.warn("English UI helper unavailable.", error);
    }

    try {
      await import(`./lore.js?v=${encodeURIComponent(version)}`);
    } catch (error) {
      console.warn("Lore module unavailable.", error);
    }

    try {
      await import(`./lightbox-hd.js?v=${encodeURIComponent(version)}`);
    } catch (error) {
      console.warn("Fullscreen HD module unavailable; using standard splash arts.", error);
    }
  </script>
</body>
</html>
