<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
  <meta name="theme-color" content="#f5f5f7" media="(prefers-color-scheme: light)">
  <meta name="description" content="Explore les champions et skins de League of Legends et Wild Rift.">
  <title>LoL Skins</title>
  <link rel="preconnect" href="https://wiki.leagueoflegends.com">
  <link rel="preconnect" href="https://ddragon.leagueoflegends.com">
  <link rel="preconnect" href="https://raw.communitydragon.org">
  <link rel="stylesheet" href="styles.css?v=20260909-10">
</head>
<body>
  <div class="app-shell">
    <main>
      <section class="hero" id="hero">
        <div class="hero-backdrop" id="heroBackdrop" aria-hidden="true"></div>
        <div class="hero-overlay" aria-hidden="true"></div>
        <button class="back-button" id="backButton" type="button" aria-label="Retour aux champions" hidden>←</button>
        <div class="hero-content">
          <h1 id="pageTitle">Tous les champions</h1>
        </div>
      </section>

      <section class="controls" aria-label="Recherche et filtres">
        <label class="search-box" for="searchInput">
          <svg aria-hidden="true" viewBox="0 0 24 24" width="20" height="20"><path d="m21 21-4.35-4.35m2.35-5.65A8 8 0 1 1 3 11a8 8 0 0 1 16 0Z" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          <input id="searchInput" type="search" autocomplete="off" spellcheck="false" enterkeyhint="search" placeholder="Rechercher un champion…">
          <kbd aria-hidden="true">/</kbd>
        </label>

        <div class="filter-row" id="filterRow" aria-label="Filtres" hidden>
          <button class="filter-chip is-active" type="button" data-filter="all">Tout</button>
          <button class="filter-chip" type="button" data-filter="pc">PC</button>
          <button class="filter-chip" type="button" data-filter="wild-rift">Wild Rift</button>
          <button class="filter-chip" type="button" data-filter="prestige">Prestige / Mythic</button>
          <button class="filter-chip" type="button" data-filter="chroma">Chromas</button>
          <button class="filter-chip" type="button" data-filter="favorites">♥ Favoris</button>
        </div>
      </section>

      <section class="content-section" aria-live="polite">
        <div class="section-heading">
          <div>
            <p class="section-kicker" id="sectionKicker">Collection</p>
            <h2 id="sectionTitle">Champions</h2>
          </div>
          <p class="result-count" id="resultCount"></p>
        </div>

        <div class="loading-state" id="loadingState">
          <span class="spinner" aria-hidden="true"></span>
          <p>Chargement de ta collection…</p>
        </div>

        <div class="empty-state" id="emptyState" hidden>
          <span aria-hidden="true">⌕</span>
          <h3>Aucun résultat</h3>
          <p>Essaie une autre recherche ou enlève un filtre.</p>
        </div>

        <div class="card-grid" id="cardGrid" hidden></div>
      </section>
    </main>
  </div>

  <div class="lightbox" id="lightbox" role="dialog" aria-modal="true" aria-label="Aperçu du skin" hidden>
    <div class="lightbox-backdrop" data-close-lightbox></div>
    <div class="lightbox-toolbar">
      <div class="lightbox-caption">
        <span id="lightboxPosition"></span>
        <strong id="lightboxTitle"></strong>
      </div>
      <button class="icon-button" id="lightboxFavorite" type="button" aria-label="Ajouter aux favoris">♡</button>
      <button class="icon-button" type="button" data-close-lightbox aria-label="Fermer">×</button>
    </div>
    <button class="lightbox-nav lightbox-prev" id="lightboxPrev" type="button" aria-label="Skin précédent">‹</button>
    <figure class="lightbox-figure" id="lightboxFigure">
      <img id="lightboxImage" alt="" decoding="async">
    </figure>
    <button class="lightbox-nav lightbox-next" id="lightboxNext" type="button" aria-label="Skin suivant">›</button>
  </div>

  <noscript>Cette application nécessite JavaScript pour afficher les skins.</noscript>
  <script type="module" src="app.js?v=20260909-10"></script>
</body>
</html>
